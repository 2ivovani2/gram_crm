# ngrok overlay — exposes the unified dev entry point via a public HTTPS tunnel.
#
# In dev, ALL traffic goes through:
#   User → ngrok (HTTPS) → nginx:80 → backends
#
# ngrok tunnels to nginx (not directly to web:8000) so Django, static files,
# media and the Telegram webhook are accessible through a single URL.
#
# Requires NGROK_AUTHTOKEN and NGROK_DOMAIN in root .env.
# Use a static ngrok domain (free plan: one domain per account) so the
# webhook URL and app URLs stay stable between restarts.
#
# Usage: make dev  (scripts/dev_up.sh adds this overlay automatically)

services:
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    # Tunnel to nginx — the unified entry point for all services.
    command: http nginx:80 --domain=${NGROK_DOMAIN} --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"   # ngrok inspector UI: http://localhost:4040
    depends_on:
      - nginx
