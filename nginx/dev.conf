# ─────────────────────────────────────────────────────────────────────────────
# Dev nginx config — HTTP only, path-based routing.
#
# TLS is terminated by ngrok upstream. nginx only sees HTTP inside Docker.
# All application traffic enters via: User → ngrok (HTTPS) → nginx:80 → backends.
#
# Routing (mirrors prod subdomain layout as path prefixes):
#   /               → Django (landing, /crm/, /docs/, /health/, /bot/webhook/)
#   /spam/          → autosending Next.js frontend (basePath=/spam)
#   /api/           → autosending FastAPI backend (AJAX calls from browser)
#   /static/        → Django staticfiles volume
#   /s3/            → MinIO S3 proxy (CRM uploads)
#
# Dev-only differences vs prod:
#   • Single server block (one ngrok domain, no subdomains)
#   • HTTP only (port 80, no SSL)
#   • Uses $variable resolver to tolerate backend containers not yet ready
# ─────────────────────────────────────────────────────────────────────────────

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ── Django static files ────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── MinIO S3 proxy — CRM file uploads ─────────────────────────────────
    location /s3/ {
        set $minio http://minio:9000;
        rewrite ^/s3/(.+)$ /$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    # ── Telegram webhook ───────────────────────────────────────────────────
    location /bot/webhook/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ngrok terminates TLS — tell Django this came in as HTTPS
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── autosending FastAPI backend ────────────────────────────────────────
    # Path /api/ mirrors the nginx routing on spam.gramly.tech in prod.
    # NEXT_PUBLIC_API_URL in dev = https://<ngrok>/api, so browser calls
    # hit this location (e.g. GET /api/sessions → spam-backend:8000/api/sessions).
    location /api/ {
        set $spam_backend http://spam-backend:8000;
        proxy_pass $spam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # ── autosending Next.js frontend ───────────────────────────────────────
    # Next.js is configured with basePath='/spam' in dev, so all routes
    # (pages, _next/static assets, HMR websocket) live under /spam/.
    # nginx passes the full path including /spam/ prefix — Next.js expects it.
    # Redirect /spam (no trailing slash) → /spam/ so Next.js receives it correctly.
    location = /spam {
        return 301 /spam/;
    }

    location /spam/ {
        set $spam_frontend http://spam-frontend:3000;
        proxy_pass $spam_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support for Next.js HMR in dev
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # ── Django: landing + CRM + docs + health + admin — catch all ─────────
    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
