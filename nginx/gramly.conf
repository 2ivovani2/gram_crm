resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP → HTTPS redirect + Let's Encrypt ACME challenge ──────────────────────
server {
    listen 80;
    server_name gramly.tech www.gramly.tech crm.gramly.tech spam.gramly.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── gramly.tech — landing + docs + bot webhook ────────────────────────────────
server {
    listen 443 ssl;
    server_name gramly.tech www.gramly.tech;

    ssl_certificate     /etc/letsencrypt/live/gramly.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramly.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # MinIO S3 proxy — CRM file uploads
    location /s3/ {
        set $minio http://minio:9000;
        rewrite ^/s3/(.+)$ /$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    # Telegram webhook
    location /bot/webhook/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # CRM login served directly on gramly.tech (Telegram widget requires bot domain match)
    location = /crm/login/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /crm/auth/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Redirect /crm/* to crm subdomain (everything except login/auth above)
    location /crm/ {
        return 302 https://crm.gramly.tech$request_uri;
    }

    # Block old stats routes — they no longer exist
    location /stats/ {
        return 404;
    }

    # Landing + docs + health
    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── crm.gramly.tech — CRM only ────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name crm.gramly.tech;

    ssl_certificate     /etc/letsencrypt/live/gramly.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramly.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 20M;

    # Redirect root and login to gramly.tech (Telegram widget requires bot domain)
    location = / {
        return 301 https://gramly.tech/crm/login/;
    }
    location = /crm/login/ {
        return 301 https://gramly.tech/crm/login/$is_args$args;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # MinIO S3 proxy (CRM screenshots)
    location /s3/ {
        set $minio http://minio:9000;
        rewrite ^/s3/(.+)$ /$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    # All CRM/docs/admin/health traffic → Django
    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── spam.gramly.tech — autosending app ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name spam.gramly.tech;

    ssl_certificate     /etc/letsencrypt/live/gramly.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramly.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10M;

    # FastAPI backend
    location /api/ {
        set $spam_backend http://spam-backend:8000;
        proxy_pass $spam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # FastAPI docs/health (available for debugging)
    location ~ ^/(docs|redoc|openapi.json|health)$ {
        set $spam_backend http://spam-backend:8000;
        proxy_pass $spam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Next.js static assets
    location /_next/static/ {
        set $spam_frontend http://spam-frontend:3000;
        proxy_pass $spam_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Login redirect to gramly.tech (Telegram widget requires bot domain)
    location = /login/ {
        return 302 https://gramly.tech/spam-login/;
    }

    # Everything else → Next.js frontend
    location / {
        set $spam_frontend http://spam-frontend:3000;
        proxy_pass $spam_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
