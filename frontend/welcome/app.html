<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090c0a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        let saved = "";
        try { saved = localStorage.getItem("gramly-hello-theme") || ""; } catch { /* Dark fallback. */ }
        const theme = saved === "light" ? "light" : "dark";
        document.documentElement.dataset.gramlyTheme = theme;
      })();
    </script>
    <style>
      html,body{background:#090c0a;color:#f3f4ed}
      html[data-gramly-theme="light"],html[data-gramly-theme="light"] body{background:#dcded5;color:#171b17}
    </style>
    <title>GramlyHello</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="mini-app-body"><div id="root"></div><script src="https://telegram.org/js/telegram-web-app.js?63"></script><script type="module" src="/src/main.tsx"></script></body>
</html>
