<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090c0a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        let saved = "";
        try { saved = localStorage.getItem("gramly-hello-theme") || ""; } catch { /* Dark fallback. */ }
        const theme = saved === "light" ? "light" : "dark";
        document.documentElement.dataset.gramlyTheme = theme;
      })();
    </script>
    <style>
      html,body{background:#090c0a;color:#f3f4ed}
      html[data-gramly-theme="light"],html[data-gramly-theme="light"] body{background:#dcded5;color:#171b17}
      .boot-fallback{min-height:100svh;box-sizing:border-box;display:grid;place-content:center;gap:16px;padding:28px;text-align:center;font:500 15px/1.5 system-ui,sans-serif}.boot-fallback b{font-size:26px}.boot-fallback a{color:#11140f;background:#ddf45b;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:750}
    </style>
    <title>GramlyHello</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="mini-app-body"><div id="root"><main class="boot-fallback"><b>GramlyHello загружается…</b><span>Если экран не откроется, проверьте соединение и повторите запуск.</span><a href="/app/">Повторить</a></main></div><noscript><main class="boot-fallback"><b>Нужен JavaScript</b><span>Откройте Mini App во встроенном браузере Telegram.</span></main></noscript><script type="module" src="/src/main.tsx"></script></body>
</html>
