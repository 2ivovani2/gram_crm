apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gramly-public
  namespace: traefik-public
  labels:
    gramly.tech/controller: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: gramly-public
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: auth-https
      hostname: auth.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: auth-gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: vpn-https
      hostname: vpn.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vpn-gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: gramly-https
      hostname: gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: www-https
      hostname: www.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: hello-https
      hostname: hello.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hello-gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: media-https
      hostname: media.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: media-gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/contour: public
    - name: bot-https
      hostname: bot.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bot-gramly-tech-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gramly.tech/access-plane: business
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gramly-public-access
  namespace: traefik-public
  labels:
    gramly.tech/controller: public
spec:
  gatewayClassName: gramly-public
  listeners:
    - name: crm-https
      hostname: crm.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: crm-gramly-tech-tls}]
      allowedRoutes: &public-routes
        namespaces:
          from: Selector
          selector: {matchLabels: {gramly.tech/contour: public}}
    - name: git-https
      hostname: git.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: git-gramly-tech-tls}]
      allowedRoutes: *public-routes
    - name: tasks-https
      hostname: tasks.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: tasks-gramly-tech-tls}]
      allowedRoutes: *public-routes
    - name: docs-https
      hostname: docs.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: docs-gramly-tech-tls}]
      allowedRoutes: *public-routes
    - name: grafana-https
      hostname: grafana.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: grafana-gramly-tech-tls}]
      allowedRoutes: *public-routes
    - name: cluster-https
      hostname: cluster.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: cluster-gramly-tech-tls}]
      allowedRoutes: *public-routes
    - name: hello-admin-https
      hostname: hello-admin.gramly.tech
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: hello-admin-gramly-tech-tls}]
      allowedRoutes: *public-routes
