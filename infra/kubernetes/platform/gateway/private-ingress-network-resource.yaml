apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: traefik-private
  namespace: traefik-private
  labels:
    app.kubernetes.io/part-of: gramly-private-ingress
spec:
  networkRouterRef:
    name: gramly-private
    namespace: vpn
  serviceRef:
    name: traefik-private
  groups:
    # Infrastructure applications are reachable only from the DevOps/owner
    # source groups allowed by the gramly-devops-infrastructure policy.
    - name: gramly-devops-services
