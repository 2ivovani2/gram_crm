deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingressClass:
  enabled: false

providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    namespaces:
      - traefik-public
      - identity
      - vpn
      - gramly-hello
      - gramly-crm
      - gramly-staging
      - gramly-welcome
  kubernetesGateway:
    enabled: true
    labelSelector: gramly.tech/controller=public
    namespaces:
      - traefik-public
      - identity
      - vpn
      - gramly-hello
      - gramly-crm
      - gramly-staging
      - gramly-welcome

gateway:
  enabled: false

gatewayClass:
  enabled: true
  name: gramly-public
  labels:
    gramly.tech/controller: public

# NetBird shares the public TLS entrypoint and uses long-lived streaming POSTs.
# Traefik's 60s readTimeout otherwise terminates Signal and Management streams.
additionalArguments:
  - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=3600s

ports:
  netbird-stun:
    port: 3478
    expose:
      default: true
    exposedPort: 3478
    protocol: UDP

service:
  annotations:
    # NetBird uses long-lived gRPC streams for management and signalling.
    # Keep the Vultr Load Balancer from terminating an otherwise healthy stream.
    service.beta.kubernetes.io/vultr-loadbalancer-timeout: "3600"
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Local

log:
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop

api:
  dashboard: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
