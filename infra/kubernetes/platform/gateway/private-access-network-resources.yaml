apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: collaboration-gateway
  namespace: traefik-collaboration
  labels:
    app.kubernetes.io/part-of: gramly-private-access
spec:
  networkRouterRef:
    name: gramly-private
    namespace: vpn
  serviceRef:
    name: traefik-collaboration
  groups:
    - name: gramly-collaboration-services
