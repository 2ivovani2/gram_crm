apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: business-gateway
  namespace: traefik-business
  labels:
    app.kubernetes.io/part-of: gramly-private-access
spec:
  networkRouterRef:
    name: gramly-private
    namespace: vpn
  serviceRef:
    name: traefik-business
  groups:
    - name: gramly-business-services
