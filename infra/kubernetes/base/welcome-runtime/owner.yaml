apiVersion: apps/v1
kind: Deployment
metadata: {name: gramly-welcome-worker-owner, namespace: gramly-welcome}
spec:
  # Enabled explicitly by the production cutover overlay AFTER migration.
  replicas: 0
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-owner}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-worker-owner}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      terminationGracePeriodSeconds: 180
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-owner}}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: WELCOME_IMAGE_PLACEHOLDER
          command: [welcome-worker-owner]
          envFrom: [{secretRef: {name: gramly-welcome-runtime}}]
          env:
            - {name: WELCOME_SEPARATE_OWNER_WORKER, value: "true"}
            - {name: WELCOME_OWNER_CONCURRENCY, value: "2"}
            # Two action connections, two outbox connections, lease renewals
            # and a metrics connection. Bounded independently of client load.
            - {name: WELCOME_DATABASE_POOL_SIZE, value: "8"}
            - {name: WELCOME_DATABASE_MAX_OVERFLOW, value: "0"}
          ports: [{name: metrics, containerPort: 9090}, {name: health, containerPort: 9091}]
          startupProbe:
            httpGet: {path: /health/live, port: health}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health/live, port: health}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: health}
            periodSeconds: 10
            failureThreshold: 2
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: temporary-media, mountPath: /tmp}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
      volumes: [{name: temporary-media, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gramly-welcome-worker-owner, namespace: gramly-welcome}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-owner}}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gramly-welcome-worker-owner
  namespace: gramly-welcome
  labels: {release: kube-prometheus-stack}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-owner}}
  podMetricsEndpoints: [{port: metrics, path: /metrics, interval: 30s}]
