apiVersion: apps/v1
kind: Deployment
metadata: {name: gramly-welcome-api, namespace: gramly-welcome}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-api}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-api}}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: WELCOME_IMAGE_PLACEHOLDER
          envFrom: [{secretRef: {name: gramly-welcome-runtime}}]
          env:
            # Ten API replicas still consume at most twenty database sessions.
            - {name: WELCOME_DATABASE_POOL_SIZE, value: "2"}
            - {name: WELCOME_DATABASE_MAX_OVERFLOW, value: "0"}
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          startupProbe: &live {httpGet: {path: /health/live, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: *live
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gramly-welcome-api, namespace: gramly-welcome}
spec:
  selector: {app.kubernetes.io/name: gramly-welcome-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gramly-welcome-api, namespace: gramly-welcome}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gramly-welcome-api, namespace: gramly-welcome}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gramly-welcome-api}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gramly-welcome-api
  namespace: gramly-welcome
  labels: {release: kube-prometheus-stack}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-api}}
  podMetricsEndpoints: [{port: http, path: /metrics/, interval: 30s}]
