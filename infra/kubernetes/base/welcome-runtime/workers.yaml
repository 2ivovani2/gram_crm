apiVersion: apps/v1
kind: Deployment
metadata: {name: gramly-welcome-worker-events, namespace: gramly-welcome}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      terminationGracePeriodSeconds: 180
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: WELCOME_IMAGE_PLACEHOLDER
          command: [welcome-worker-events]
          envFrom:
            - {secretRef: {name: gramly-welcome-runtime}}
            - {secretRef: {name: gramly-view-mtproto, optional: true}}
          env:
            # Bound database usage while KEDA scales the number of consumers.
            - {name: WELCOME_WORKER_CONCURRENCY, value: "3"}
            - {name: WELCOME_DATABASE_POOL_SIZE, value: "3"}
            - {name: WELCOME_DATABASE_MAX_OVERFLOW, value: "0"}
          ports: [{name: metrics, containerPort: 9090}, {name: health, containerPort: 9091}]
          startupProbe:
            httpGet: {path: /health/live, port: health}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health/live, port: health}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: health}
            periodSeconds: 10
            failureThreshold: 2
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: temporary-media, mountPath: /tmp}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes: [{name: temporary-media, emptyDir: {sizeLimit: 256Mi}}]
---
