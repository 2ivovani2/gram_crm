apiVersion: apps/v1
kind: Deployment
metadata: {name: gramly-welcome-worker-events, namespace: gramly-welcome}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      terminationGracePeriodSeconds: 180
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: WELCOME_IMAGE_PLACEHOLDER
          command: [welcome-worker-events]
          envFrom: [{secretRef: {name: gramly-welcome-runtime}}]
          env:
            - {name: WELCOME_WORKER_CONCURRENCY, value: "8"}
            - {name: WELCOME_DATABASE_POOL_SIZE, value: "6"}
            - {name: WELCOME_DATABASE_MAX_OVERFLOW, value: "2"}
          ports: [{name: metrics, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gramly-welcome-worker-delivery, namespace: gramly-welcome}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-delivery}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-worker-delivery}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      terminationGracePeriodSeconds: 180
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: WELCOME_IMAGE_PLACEHOLDER
          command: [welcome-worker-delivery]
          envFrom: [{secretRef: {name: gramly-welcome-runtime}}]
          env:
            - {name: WELCOME_DATABASE_POOL_SIZE, value: "4"}
            - {name: WELCOME_DATABASE_MAX_OVERFLOW, value: "2"}
          ports: [{name: metrics, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: temporary-media, mountPath: /tmp}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes: [{name: temporary-media, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gramly-welcome-worker-events, namespace: gramly-welcome}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gramly-welcome-worker-delivery, namespace: gramly-welcome}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-delivery}}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gramly-welcome-worker-events
  namespace: gramly-welcome
  labels: {release: kube-prometheus-stack}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-events}}
  podMetricsEndpoints: [{port: metrics, path: /metrics, interval: 30s}]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gramly-welcome-worker-delivery
  namespace: gramly-welcome
  labels: {release: kube-prometheus-stack}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-delivery}}
  podMetricsEndpoints: [{port: metrics, path: /metrics, interval: 30s}]
