apiVersion: apps/v1
kind: Deployment
metadata: {name: gramly-welcome-worker-view, namespace: gramly-welcome}
spec:
  # One consumer preserves each person's update order across batches. Long
  # scans never consume Gramly Hello's event-worker capacity.
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-view}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-worker-view}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      terminationGracePeriodSeconds: 900
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: WELCOME_IMAGE_PLACEHOLDER
          command: [welcome-worker-view]
          envFrom:
            - {secretRef: {name: gramly-welcome-runtime}}
            - {secretRef: {name: gramly-view-mtproto, optional: true}}
          env:
            - {name: WELCOME_DATABASE_POOL_SIZE, value: "4"}
            - {name: WELCOME_DATABASE_MAX_OVERFLOW, value: "0"}
          ports: [{name: metrics, containerPort: 9090}, {name: health, containerPort: 9091}]
          startupProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 10, failureThreshold: 2}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: scratch, mountPath: /tmp}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes: [{name: scratch, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gramly-welcome-worker-view
  namespace: gramly-welcome
  labels: {release: kube-prometheus-stack}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: gramly-welcome-worker-view}}
  podMetricsEndpoints: [{port: metrics, path: /metrics, interval: 30s}]
