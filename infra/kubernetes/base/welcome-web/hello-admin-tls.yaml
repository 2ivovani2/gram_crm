apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: hello-admin-gramly-tech, namespace: traefik-public}
spec:
  secretName: hello-admin-gramly-tech-tls
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: letsencrypt-production}
  dnsNames: [hello-admin.gramly.tech]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: infrastructure-hello-admin-tls, namespace: traefik-public}
spec:
  from: [{group: gateway.networking.k8s.io, kind: Gateway, namespace: traefik-private}]
  to: [{group: "", kind: Secret, name: hello-admin-gramly-tech-tls}]
