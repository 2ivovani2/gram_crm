apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-welcome-mini-app
  namespace: gramly-welcome
spec:
  parentRefs:
    - {name: gramly-public, namespace: traefik-public, sectionName: hello-https}
  hostnames: [hello.gramly.tech]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /app}
        - path: {type: PathPrefix, value: /api/v1}
        - path: {type: Exact, value: /favicon.svg}
        - path: {type: Exact, value: /favicon.ico}
        - path: {type: Exact, value: /favicon-32.png}
        - path: {type: Exact, value: /favicon-192.png}
        - path: {type: Exact, value: /favicon-512.png}
        - path: {type: Exact, value: /apple-touch-icon.png}
        - path: {type: Exact, value: /site.webmanifest}
      backendRefs: [{name: gramly-welcome-web, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-welcome-admin
  namespace: gramly-welcome
spec:
  parentRefs:
    - {name: gramly-infrastructure, namespace: traefik-private, sectionName: hello-admin-https}
  hostnames: [hello-admin.gramly.tech]
  rules:
    - backendRefs: [{name: gramly-welcome-admin-auth, port: 4180}]
