apiVersion: batch/v1
kind: Job
metadata:
  name: gramly-welcome-migrate
  namespace: gramly-welcome
  labels: {app.kubernetes.io/name: gramly-welcome-migrate}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-welcome-migrate}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gramly-welcome-registry}]
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: WELCOME_IMAGE_PLACEHOLDER
          command: [alembic, upgrade, head]
          envFrom: [{secretRef: {name: gramly-welcome-runtime}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
