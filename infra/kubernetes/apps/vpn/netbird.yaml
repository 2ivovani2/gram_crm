apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-data
  namespace: vpn
  labels:
    app.kubernetes.io/name: netbird-server
    app.kubernetes.io/part-of: gramly-vpn
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vultr-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-server
  namespace: vpn
  labels:
    app.kubernetes.io/name: netbird-server
    app.kubernetes.io/part-of: gramly-vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-server
        app.kubernetes.io/part-of: gramly-vpn
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: server
          image: NETBIRD_SERVER_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/netbird/config.yaml
          ports:
            - name: application
              containerPort: 80
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: health
              containerPort: 9000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth2/.well-known/openid-configuration
              port: application
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: application
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
              readOnly: true
            - name: data
              mountPath: /var/lib/netbird
      volumes:
        - name: config
          secret:
            secretName: netbird-config
        - name: data
          persistentVolumeClaim:
            claimName: netbird-data
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: vpn
  labels:
    app.kubernetes.io/name: netbird-server
    app.kubernetes.io/part-of: gramly-vpn
spec:
  # The server's readiness includes an external relay loopback through the
  # public Gateway. Publishing the endpoint breaks that intentional bootstrap
  # cycle while liveness still verifies that the process is listening.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: netbird-server
  ports:
    - name: http
      port: 80
      targetPort: application
      protocol: TCP
      appProtocol: http
    - name: grpc
      port: 81
      targetPort: application
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: stun
      port: 3478
      targetPort: stun
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: vpn
  labels:
    app.kubernetes.io/name: netbird-dashboard
    app.kubernetes.io/part-of: gramly-vpn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-dashboard
        app.kubernetes.io/part-of: gramly-vpn
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: netbird-dashboard
      initContainers:
        - name: prepare-nginx-runtime
          image: NETBIRD_DASHBOARD_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p /var/lib/nginx/tmp/client_body /var/lib/nginx/logs /run/nginx
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-state
              mountPath: /var/lib/nginx
            - name: nginx-run
              mountPath: /run/nginx
      containers:
        - name: dashboard
          image: NETBIRD_DASHBOARD_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: https://vpn.gramly.tech
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: https://vpn.gramly.tech
            - name: AUTH_AUDIENCE
              value: netbird-dashboard
            - name: AUTH_CLIENT_ID
              value: netbird-dashboard
            - name: AUTH_CLIENT_SECRET
              value: ""
            - name: AUTH_AUTHORITY
              value: https://vpn.gramly.tech/oauth2
            - name: USE_AUTH0
              value: "false"
            - name: AUTH_SUPPORTED_SCOPES
              value: openid profile email groups
            - name: AUTH_REDIRECT_URI
              value: /nb-auth
            - name: AUTH_SILENT_REDIRECT_URI
              value: /nb-silent-auth
            - name: NGINX_SSL_PORT
              value: "443"
            - name: LETSENCRYPT_DOMAIN
              value: none
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            # The upstream entrypoint prepares nginx runtime directories before
            # nginx drops worker privileges. Keep the container sandboxed and
            # grant only the capability required to bind port 80.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
          volumeMounts:
            - name: nginx-state
              mountPath: /var/lib/nginx
            - name: nginx-run
              mountPath: /run/nginx
      volumes:
        - name: nginx-state
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: vpn
  labels:
    app.kubernetes.io/name: netbird-dashboard
    app.kubernetes.io/part-of: gramly-vpn
spec:
  selector:
    app.kubernetes.io/name: netbird-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netbird-dashboard
  namespace: vpn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-dashboard
