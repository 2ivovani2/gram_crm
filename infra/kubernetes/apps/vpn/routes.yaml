apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: vpn
spec:
  parentRefs:
    - name: gramly-public
      namespace: traefik-public
      sectionName: vpn-https
  hostnames:
    - vpn.gramly.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange/
        - path:
            type: PathPrefix
            value: /management.ManagementService/
        - path:
            type: PathPrefix
            value: /management.ProxyService/
      backendRefs:
        - name: netbird-server
          port: 81
      # NetBird keeps management and signal gRPC streams open for the VPN
      # session. Traefik treats a zero Gateway API duration as its 60-second
      # default, so use an explicit long request timeout here.
      timeouts:
        request: "3600s"
    - matches:
        - path:
            type: PathPrefix
            value: /relay
        - path:
            type: PathPrefix
            value: /ws-proxy/
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: netbird-server
          port: 80
    - backendRefs:
        - name: netbird-dashboard
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: netbird-stun
  namespace: vpn
spec:
  entryPoints:
    - netbird-stun
  routes:
    - services:
        - name: netbird-server
          port: 3478
