apiVersion: v1
kind: ConfigMap
metadata:
  name: gramly-media-proxy
  namespace: gramly-hello
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      server {
        listen 8080;
        client_max_body_size 0;

        location / {
          proxy_pass http://gramly-crm-minio.gramly-crm.svc.cluster.local:9000;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Connection "";
          proxy_set_header X-Forwarded-Proto https;
          proxy_request_buffering off;
          proxy_buffering off;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gramly-media-proxy
  namespace: gramly-hello
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: gramly-media-proxy}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gramly-media-proxy}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          readinessProbe: &probe {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: *probe
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: gramly-media-proxy}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gramly-media-proxy
  namespace: gramly-hello
spec:
  selector: {app.kubernetes.io/name: gramly-media-proxy}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gramly-media-proxy
  namespace: gramly-hello
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: gramly-media-proxy}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-public-media
  namespace: gramly-hello
spec:
  parentRefs:
    - name: gramly-public
      namespace: traefik-public
      sectionName: media-https
  hostnames: [media.gramly.tech]
  rules:
    - backendRefs: [{name: gramly-media-proxy, port: 8080}]
