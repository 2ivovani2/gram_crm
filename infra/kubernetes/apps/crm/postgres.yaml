apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gramly-crm-backups
  namespace: gramly-crm
spec:
  configuration:
    destinationPath: s3://gramly-backups/cnpg/gramly-crm
    endpointURL: https://ewr1.vultrobjects.com
    s3Credentials:
      accessKeyId:
        name: gramly-cnpg-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: gramly-cnpg-backup-s3
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: gramly-cnpg-backup-s3
        key: AWS_REGION
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2
      immediateCheckpoint: false
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gramly-crm-postgres
  namespace: gramly-crm
spec:
  instances: 2
  minSyncReplicas: 1
  maxSyncReplicas: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie@sha256:78c4fdf165e8ffb1b5b7a7fc6b22b3cf37890a338b4c1c8c4d913896129a86da
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: gramly
      owner: gramly
      secret:
        name: gramly-crm-postgres-app
      encoding: UTF8
  storage:
    storageClass: vultr-block-storage-retain
    size: 10Gi
  resources:
    requests: {cpu: 150m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    parameters:
      max_connections: "150"
      shared_buffers: 256MB
      synchronous_commit: "on"
      log_min_duration_statement: "1000"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gramly-crm-backups
  enableSuperuserAccess: true
  managed:
    roles:
      - name: gramly_welcome
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret: {name: gramly-welcome-postgres-role}
      - name: gramly_welcome_staging
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret: {name: gramly-welcome-staging-postgres-role}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: gramly-welcome-pooler
  namespace: gramly-crm
spec:
  cluster: {name: gramly-crm-postgres}
  instances: 3
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "30"
      reserve_pool_size: "10"
      reserve_pool_timeout: "2"
      max_prepared_statements: "100"
    paused: false
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gramly-crm-postgres-daily
  namespace: gramly-crm
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster: {name: gramly-crm-postgres}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gramly-welcome
  namespace: gramly-crm
spec:
  name: gramly_welcome
  owner: gramly_welcome
  cluster: {name: gramly-crm-postgres}
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gramly-welcome-staging
  namespace: gramly-crm
spec:
  name: gramly_welcome_staging
  owner: gramly_welcome_staging
  cluster: {name: gramly-crm-postgres}
  databaseReclaimPolicy: retain
