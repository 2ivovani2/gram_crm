apiVersion: v1
kind: ConfigMap
metadata:
  name: gramly-welcome-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: gramly-platform
data:
  gramly-welcome.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(rate(welcome_webhook_requests_total[5m]))", "refId": "A"}],
          "title": "Webhook rate", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.25}, {"color": "red", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(welcome_webhook_duration_seconds_bucket[5m])))", "refId": "A"}],
          "title": "Webhook p95", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0}, "id": 3,
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(welcome_queue_depth{status=\"actionable\"})", "refId": "A"}],
          "title": "Actionable queue", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 30}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0}, "id": 4,
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "max(welcome_oldest_pending_age_seconds)", "refId": "A"}],
          "title": "Oldest pending", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops", "color": {"mode": "palette-classic"}, "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "stacking": {"group": "A", "mode": "none"}}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (result) (rate(welcome_webhook_requests_total[5m]))", "legendFormat": "{{result}}", "refId": "A"}],
          "title": "Webhook results", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops", "color": {"mode": "palette-classic"}, "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "stacking": {"group": "A", "mode": "none"}}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (result) (rate(welcome_delivery_attempts_total[5m]))", "legendFormat": "{{result}}", "refId": "A"}],
          "title": "Telegram delivery attempts", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}, "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "stacking": {"group": "A", "mode": "none"}}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13}, "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (queue, status) (welcome_queue_depth)", "legendFormat": "{{queue}} / {{status}}", "refId": "A"}],
          "title": "Durable queue depth", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}, "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "stacking": {"group": "A", "mode": "none"}}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13}, "id": 8,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (kind) (welcome_worker_active)", "legendFormat": "{{kind}}", "refId": "A"}],
          "title": "Active workers", "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["gramly", "welcome", "telegram"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Gramly / Welcome",
      "uid": "gramly-welcome",
      "version": 1
    }
