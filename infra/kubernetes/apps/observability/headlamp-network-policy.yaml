apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: headlamp-require-oidc-proxy, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: headlamp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: observability-oauth2-proxy
      ports: [{protocol: TCP, port: 4466}]
