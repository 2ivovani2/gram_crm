apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: grafana, namespace: observability}
spec:
  parentRefs:
    - {name: gramly-infrastructure, namespace: traefik-private, sectionName: http}
    - {name: gramly-infrastructure, namespace: traefik-private, sectionName: grafana-https}
  hostnames: [grafana.gramly.tech]
  rules:
    - backendRefs: [{name: kube-prometheus-stack-grafana, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: headlamp, namespace: observability}
spec:
  parentRefs:
    - {name: gramly-infrastructure, namespace: traefik-private, sectionName: http}
    - {name: gramly-infrastructure, namespace: traefik-private, sectionName: cluster-https}
  hostnames: [cluster.gramly.tech]
  rules:
    - backendRefs: [{name: observability-oauth2-proxy, port: 80}]
