apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gramly-platform
  namespace: observability
  labels:
    app.kubernetes.io/name: gramly-platform-alerts
    app.kubernetes.io/part-of: gramly-platform
spec:
  groups:
    - name: gramly.workloads
      rules:
        - alert: GramlyWorkloadUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"gramly-crm|gramly-hello|gramly-welcome|gramly-staging",
              deployment=~"gramly-.*"
            } < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Gramly workload {{ $labels.deployment }} is unavailable"
            description: "No available replicas in namespace {{ $labels.namespace }} for five minutes."
        - alert: GramlyPodRestarting
          expr: |
            sum by (namespace, pod) (
              increase(kube_pod_container_status_restarts_total{
                namespace=~"gramly-crm|gramly-hello|gramly-welcome|gramly-staging"
              }[15m])
            ) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Gramly pod {{ $labels.pod }} is restarting"
            description: "More than three container restarts occurred during the last 15 minutes."
        - alert: GramlyPersistentVolumeFilling
          expr: |
            100 * kubelet_volume_stats_used_bytes{namespace=~"gramly-crm|gramly-hello|gramly-welcome|gramly-staging"}
              / kubelet_volume_stats_capacity_bytes{namespace=~"gramly-crm|gramly-hello|gramly-welcome|gramly-staging"} > 80
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Persistent volume {{ $labels.persistentvolumeclaim }} is over 80% full"
            description: "Free capacity is becoming low in namespace {{ $labels.namespace }}."
    - name: gramly.postgresql
      rules:
        - alert: GramlyPostgresMetricsMissing
          expr: |
            absent(cnpg_collector_up{namespace="gramly-crm"}) == 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "CloudNativePG metrics are missing"
            description: "Prometheus has not received CNPG collector metrics for ten minutes."
        - alert: GramlyPostgresCollectorDown
          expr: |
            cnpg_collector_up{namespace="gramly-crm"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "CloudNativePG collector is down on {{ $labels.pod }}"
            description: "The PostgreSQL metrics collector has been unavailable for five minutes."
        - alert: GramlyPostgresConnectionsHigh
          expr: |
            max by (pod) (
              sum by (pod) (cnpg_backends_total{namespace="gramly-crm"})
              / max by (pod) (cnpg_pg_settings_setting{
                  namespace="gramly-crm", name="max_connections"
                })
            ) > 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "PostgreSQL connections on {{ $labels.pod }} exceed 80%"
            description: "The instance is approaching max_connections and may reject new clients."
