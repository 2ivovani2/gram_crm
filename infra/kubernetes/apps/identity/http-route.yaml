apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: identity
spec:
  parentRefs:
    - name: gramly-public
      namespace: traefik-public
      sectionName: auth-https
  hostnames:
    - auth.gramly.tech
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
