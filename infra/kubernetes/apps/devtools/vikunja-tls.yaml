apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tasks-gramly-tech
  namespace: traefik-public
spec:
  secretName: tasks-gramly-tech-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - tasks.gramly.tech
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: collaboration-tasks-tls
  namespace: traefik-public
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik-collaboration
  to:
    - group: ""
      kind: Secret
      name: tasks-gramly-tech-tls
