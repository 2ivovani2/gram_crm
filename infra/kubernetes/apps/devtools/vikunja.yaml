apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config
  namespace: devtools
data:
  config.yml: |
    service:
      publicurl: https://tasks.gramly.tech/
      enableregistration: false
    auth:
      local:
        enabled: false
      openid:
        enabled: true
        providers:
          authentik:
            name: Gramly
            authurl: https://auth.gramly.tech/application/o/vikunja/
            scope: openid profile email
            forceuserinfo: true
            requireavailability: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-files
  namespace: devtools
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vultr-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: devtools
  labels:
    app.kubernetes.io/name: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vikunja
          image: VIKUNJA_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres
            - name: VIKUNJA_DATABASE_HOST
              value: vikunja-postgres-rw.devtools.svc.cluster.local
            - name: VIKUNJA_DATABASE_DATABASE
              value: vikunja
            - name: VIKUNJA_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: vikunja-postgres-app
                  key: username
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-postgres-app
                  key: password
            - name: VIKUNJA_SERVICE_JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-runtime
                  key: jwt-secret
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: vikunja-oidc
                  key: client-id
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-oidc
                  key: client-secret
          ports:
            - name: http
              containerPort: 3456
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet: {path: /api/v1/info, port: http}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/v1/info, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/info, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /app/vikunja/config.yml, subPath: config.yml, readOnly: true}
            - {name: files, mountPath: /app/vikunja/files}
      volumes:
        - name: config
          configMap: {name: vikunja-config}
        - name: files
          persistentVolumeClaim: {claimName: vikunja-files}
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: devtools
spec:
  selector: {app.kubernetes.io/name: vikunja}
  ports:
    - {name: http, port: 3456, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja
  namespace: devtools
spec:
  parentRefs:
    - {name: gramly-collaboration, namespace: traefik-collaboration, sectionName: http}
  hostnames: [tasks.gramly.tech]
  rules:
    - backendRefs:
        - {name: vikunja, port: 3456}
