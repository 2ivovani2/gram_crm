apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../welcome
  - route.yaml

patches:
  # Keep Docker Hub credentials for rollback; production images can also be
  # pulled from the private Forgejo registry without changing shared/staging bases.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-(api|web|worker-owner|worker-events|worker-view|worker-delivery|worker-delivery-relay|worker-interactive|worker-bulk|worker-billing|worker-notifications)
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets/-
        value: {name: gramly-forgejo-registry}
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: gramly-welcome-maintenance
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets/-
        value: {name: gramly-forgejo-registry}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: WELCOME_ACCEPT_WEBHOOKS, value: "true"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: WELCOME_WEBHOOK_IP_ADDRESS, value: "45.77.149.91"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-events
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: WELCOME_WEBHOOK_IP_ADDRESS, value: "45.77.149.91"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: WELCOME_SEPARATE_OWNER_WORKER, value: "true"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-owner
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: WELCOME_WEBHOOK_IP_ADDRESS, value: "45.77.149.91"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-(delivery|interactive|bulk)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: WELCOME_SEPARATE_OWNER_WORKER, value: "true"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-billing
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-notifications
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-events
    patch: |-
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused-replicas
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-(delivery|interactive|bulk)
    patch: |-
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused-replicas
