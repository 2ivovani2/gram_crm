apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../welcome
  - route.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-events
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-delivery
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-events
    patch: |-
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused-replicas
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-delivery
    patch: |-
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused
      - op: remove
        path: /metadata/annotations/autoscaling.keda.sh~1paused-replicas
