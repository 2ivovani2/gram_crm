apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-welcome-client
  namespace: gramly-welcome
spec:
  parentRefs:
    - name: gramly-public
      namespace: traefik-public
      sectionName: gramly-https
  hostnames: [gramly.tech]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /welcome/client/}
        - path: {type: PathPrefix, value: /welcome/webhook/}
      backendRefs: [{name: gramly-welcome-api, port: 8080}]
