apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-welcome-staging
  namespace: gramly-welcome
spec:
  parentRefs:
    - name: gramly-public
      namespace: traefik-public
      sectionName: gramly-https
  hostnames: [gramly.tech]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /welcome-staging/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /welcome/
      backendRefs: [{name: gramly-welcome-api-staging, port: 8080}]
