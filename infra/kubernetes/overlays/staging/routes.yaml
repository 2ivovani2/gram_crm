apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-crm-private
  namespace: gramly-crm
spec:
  hostnames: [crm.staging.gramly.tech]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-crm-telegram-webhook
  namespace: gramly-crm
spec:
  hostnames: [bot.staging.gramly.tech]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramly-public-web
  namespace: gramly-hello
spec:
  hostnames: [staging.gramly.tech, hello.staging.gramly.tech]
