apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gramly-staging
nameSuffix: -staging

resources:
  - namespace.yaml
  - ../../base/crm
  - ../../base/welcome-runtime
  - ../../base/welcome-autoscaling
  - welcome-route.yaml

labels:
  - pairs:
      gramly.tech/environment: staging
    includeSelectors: false

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gramly-welcome-worker-view
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets/-
        value: {name: gramly-forgejo-registry}
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: gramly-view-health|gramly-view-collector|gramly-view-monitor
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets/-
        value: {name: gramly-forgejo-registry}
  - path: routes.yaml
  - path: workloads.yaml
  - path: welcome-workloads.yaml
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-events
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: gramly-welcome-worker-events-staging
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-delivery
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: gramly-welcome-worker-delivery-staging
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-interactive
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: gramly-welcome-worker-interactive-staging
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: gramly-welcome-worker-bulk
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: gramly-welcome-worker-bulk-staging
  # Gateway API backendRefs are custom-resource fields, so Kustomize cannot
  # infer nameSuffix references without an OpenAPI schema. Patch them
  # explicitly to keep the staging routes internally consistent.
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: gramly-crm-private
      namespace: gramly-crm
    patch: |-
      - op: replace
        path: /spec/rules/1/backendRefs/0/name
        value: gramly-crm-web-staging
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: gramly-crm-telegram-webhook
      namespace: gramly-crm
    patch: |-
      - op: replace
        path: /spec/rules/0/backendRefs/0/name
        value: gramly-crm-web-staging
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: gramly-public-web
      namespace: gramly-hello
    patch: |-
      - op: replace
        path: /spec/rules/0/backendRefs/0/name
        value: gramly-public-web-staging
