include /etc/nginx/modules-enabled/*.conf;

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
}

stream {
    log_format edge '$remote_addr [$time_local] $protocol $status '
                    '$bytes_sent $bytes_received $session_time upstream=$upstream_addr';
    access_log /var/log/nginx/edge-access.log edge buffer=32k flush=5s;

    upstream gramly_http {
        server 45.77.149.91:80 max_fails=3 fail_timeout=10s;
    }

    upstream gramly_https {
        server 45.77.149.91:443 max_fails=3 fail_timeout=10s;
    }

    upstream gramly_stun {
        server 45.77.149.91:3478;
    }

    server {
        listen 80 reuseport;
        proxy_connect_timeout 5s;
        proxy_timeout 75s;
        proxy_pass gramly_http;
    }

    server {
        listen 443 reuseport;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass gramly_https;
    }

    server {
        listen 3478 udp reuseport;
        proxy_timeout 30s;
        proxy_responses 1;
        proxy_pass gramly_stun;
    }
}
