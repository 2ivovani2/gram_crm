events {}

# Temporary Russia-compatible L4 edge. TLS stays terminated by the Kubernetes
# public ingress; this host only forwards encrypted TCP and NetBird STUN UDP.
stream {
    upstream gramly_vke_http {
        server 45.77.149.91:80;
    }

    upstream gramly_vke_https {
        server 45.77.149.91:443;
    }

    upstream gramly_vke_stun {
        server 45.77.149.91:3478;
    }

    server {
        listen 80;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
        proxy_pass gramly_vke_http;
    }

    server {
        listen 443;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
        proxy_pass gramly_vke_https;
    }

    server {
        listen 3478 udp reuseport;
        proxy_timeout 60s;
        proxy_responses 1;
        proxy_pass gramly_vke_stun;
    }
}
