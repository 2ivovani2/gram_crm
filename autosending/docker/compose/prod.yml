# ─────────────────────────────────────────────────────────────────────────────
# Prod overrides
# • Uses final "runtime"/"runner" stages (source baked into the image)
# • All traffic enters through nginx on port 80 only
# • Restart policy: unless-stopped
# • Health checks gate nginx startup so it never proxies a dead service
# • Memory limits to prevent runaway containers
# ─────────────────────────────────────────────────────────────────────────────

name: autosending

services:
  backend:
    build:
      target: runtime
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:   { memory: 512M }
        reservations: { memory: 128M }

  frontend:
    build:
      target: runner
      args:
        # Baked in at build time — must match the public URL nginx serves
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost/api}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:   { memory: 256M }
        reservations: { memory: 64M }

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # Compose resolves this relative to docker/compose/ → docker/nginx/nginx.conf
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:   { memory: 64M }
