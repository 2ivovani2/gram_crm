<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Вход — Gramly AutoSending</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#EFE8DA; --surface:#FBFAF5; --surface-2:#FFFFFF;
  --ink:#1A1714; --ink-2:#3B342C;
  --muted:#7A6F60; --muted2:#9D9182;
  --line: rgba(26,23,20,.10);
  --line-2: rgba(26,23,20,.06);
  --accent:#8A5A1F; --accent-tint:rgba(201,153,75,.14);
  --accent-soft:#F4E6C6; --accent-ink:#4E3010;
  --accent-glow: rgba(138,90,31,.28);
  --danger:#9A3434; --danger-soft:rgba(154,52,52,.12);
  --glass-stroke: rgba(255,255,255,.55);
}
body {
  font-family: 'Manrope', system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  letter-spacing: -.005em;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  position: relative;
  font-feature-settings: "ss01","cv11";
}
body::before {
  content:''; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 50% 40% at 12% 18%, rgba(201,153,75,.40) 0%, transparent 60%),
    radial-gradient(ellipse 40% 35% at 88% 18%, rgba(138,90,31,.28) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 88%, rgba(160,107,39,.22) 0%, transparent 60%);
  filter: blur(70px) saturate(120%);
  animation: orb-drift 22s ease-in-out infinite alternate;
}
body::after {
  content:''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(26,23,20,.035) .9px, transparent .9px);
  background-size: 22px 22px; opacity: .45;
}
@keyframes orb-drift {
  0%   { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-30px, 20px, 0) scale(1.05); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(18px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-stroke);
  border-radius: 24px;
  padding: 44px 38px;
  text-align: center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -1px 0 rgba(26,23,20,.04),
    0 32px 80px -20px rgba(26,23,20,.28),
    0 16px 40px -16px var(--accent-glow);
  animation: cardIn .6s cubic-bezier(.2,.8,.3,1) both;
  overflow: hidden;
}
.card::before {
  content:''; position: absolute; inset: -1px; border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(500px circle at var(--mx,30%) var(--my,20%),
              rgba(201,153,75,.14) 0%, transparent 40%);
  opacity: 0; transition: opacity .4s;
}
.card:hover::before { opacity: 1; }
.card::after {
  content:''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
  pointer-events: none;
}

.logo {
  display: inline-flex; align-items: center; gap: 12px;
  margin-bottom: 8px;
}
.logo-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background:
    radial-gradient(120% 120% at 0% 0%, rgba(201,153,75,.55) 0%, transparent 60%),
    linear-gradient(135deg, #2A241E 0%, #1A1714 100%);
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 6px 18px -6px rgba(26,23,20,.35), inset 0 1px 0 rgba(255,255,255,.12);
}
.logo-name {
  font-size: 22px; font-weight: 800;
  letter-spacing: -.025em; color: var(--ink);
}
.logo-sub {
  font-size: 12.5px; color: var(--muted);
  margin-bottom: 32px;
  font-weight: 600;
  letter-spacing: .02em;
}

h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 34px; font-weight: 400;
  letter-spacing: -.025em;
  margin-bottom: 12px;
  line-height: 1.04;
  color: var(--ink);
}
h1 em {
  font-style: italic;
  background: linear-gradient(135deg, #A06B27 0%, #8A5A1F 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.subtitle {
  font-size: 13.5px; color: var(--muted);
  line-height: 1.65; margin-bottom: 28px;
  font-weight: 500;
}
.widget-wrap {
  display: flex; justify-content: center;
  min-height: 44px;
  margin-bottom: 16px;
  padding: 20px;
  background: rgba(255,255,255,.45);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--glass-stroke);
  border-radius: 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(26,23,20,.03);
}
.error {
  font-size: 12.5px; color: var(--danger);
  background: var(--danger-soft);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(154,52,52,.28);
  border-radius: 10px;
  padding: 11px 14px;
  text-align: left;
  margin-bottom: 14px;
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
}
.footer {
  margin-top: 28px;
  font-size: 11.5px; color: var(--muted);
  line-height: 1.6; font-weight: 500;
}
.footer a {
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 700;
  transition: color .15s;
}
.footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8C57E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </div>
    <span class="logo-name">Gramly</span>
  </div>
  <div class="logo-sub">AutoSending</div>

  <h1>Войти в <em>систему</em></h1>
  <p class="subtitle">Используй свой Telegram-аккаунт</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <div class="widget-wrap">
    {% if bot_username %}
    <script
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="{{ bot_username }}"
      data-size="large"
      data-auth-url="{{ callback_url }}"
      data-request-access="write"
      async>
    </script>
    {% else %}
    <div style="color:var(--danger);font-size:13px;font-weight:500">Конфигурация не завершена</div>
    {% endif %}
  </div>

  <p class="footer">
    Часть экосистемы <a href="/">Gramly</a>
    <span style="color:var(--line);margin:0 6px">·</span>
    <a href="/crm/login/">CRM</a>
    <span style="color:var(--line);margin:0 6px">·</span>
    <a href="/docs/">Документация</a>
  </p>
</div>

<script>
const card = document.getElementById('card');
if (card) {
  card.addEventListener('pointermove', (e) => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100) + '%');
    card.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100) + '%');
  });
}
</script>
</body>
</html>
