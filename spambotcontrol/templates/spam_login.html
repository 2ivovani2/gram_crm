<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Вход — Gramly AutoSending</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --void: #07080A;
  --ink-2: #111317;
  --ink-3: #1A1D24;
  --paper: #FAFAFB;
  --muted:   rgba(250,250,251,.55);
  --muted-2: rgba(250,250,251,.35);
  --muted-3: rgba(250,250,251,.22);
  --line:    rgba(250,250,251,.08);
  --line-hi: rgba(250,250,251,.18);
  --brass: #FFB84D; --brass-soft:#FFD485;
  --brass-glow: rgba(255,184,77,.32);
  --live: #7CE2FF; --live-soft: rgba(124,226,255,.18);
  --ok: #4ADE80;
  --err: #FF6B6B; --err-soft: rgba(255,107,107,.12);
  --display:'Space Grotesk',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
body {
  font-family: var(--sans);
  background: var(--void); color: var(--paper);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
  position: relative; overflow: hidden;
  padding: 24px;
}
::selection { background: var(--brass); color: var(--void); }

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(250,250,251,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(250,250,251,.04) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
}
body::after {
  content: ''; position: fixed; inset: -10%; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 50% 40% at 20% 30%, rgba(255,184,77,.20) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 70%, rgba(124,226,255,.10) 0%, transparent 60%);
  filter: blur(40px);
  animation: orb 22s ease-in-out infinite alternate;
}
@keyframes orb   { 100% { transform: translate3d(-30px, 24px, 0) scale(1.05); } }
@keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.4; transform: scale(.6); } }
@keyframes cardIn {
  from { opacity:0; transform: translateY(22px) scale(.98); }
  to   { opacity:1; transform: none; }
}

.top-bar, .bottom-bar {
  position: fixed; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 28px;
  font-family: var(--mono); font-size: 11px;
  color: var(--muted-2);
  letter-spacing: .12em; text-transform: uppercase;
}
.top-bar { top: 0; }
.bottom-bar { bottom: 0; color: var(--muted-3); font-size: 10.5px; }
.top-bar .brand-mini {
  display: flex; align-items: center; gap: 10px; color: var(--paper);
}
.top-bar .brand-mini .g {
  width: 18px; height: 18px; border-radius: 4px;
  background: var(--brass); position: relative;
  box-shadow: 0 0 12px var(--brass-glow);
}
.top-bar .brand-mini .g::before {
  content:''; position: absolute; inset: 3px;
  background: var(--ink-3); border-radius: 2px;
}
.top-bar .brand-mini .g::after {
  content:''; position: absolute; width: 4px; height: 4px;
  background: var(--brass); border-radius: 50%;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
}
.top-bar .status {
  display: flex; align-items: center; gap: 10px;
  color: var(--ok);
}
.top-bar .status .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 4px rgba(74,222,128,.18), 0 0 12px rgba(74,222,128,.5);
  animation: pulse 2.2s ease infinite;
}
.bottom-bar .ln { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
.bottom-bar .l { display: flex; align-items: center; gap: 12px; }

.card {
  position: relative; z-index: 1; overflow: hidden;
  width: 100%; max-width: 420px;
  background: rgba(11,12,15,.7);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 40px 36px 32px;
  text-align: center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 32px 80px -20px rgba(0,0,0,.6),
    0 16px 40px -16px var(--brass-glow);
  animation: cardIn .6s cubic-bezier(.2,.8,.3,1) both;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 20%, var(--brass) 50%, transparent 80%);
  pointer-events: none;
}
.card::after {
  content: ''; position: absolute; inset: -1px;
  pointer-events: none; border-radius: inherit;
  background: radial-gradient(500px circle at var(--mx,30%) var(--my,20%),
              rgba(255,184,77,.10) 0%, transparent 40%);
  opacity: 0; transition: opacity .5s;
}
.card:hover::after { opacity: 1; }

.logo {
  display: inline-flex; align-items: center; gap: 12px;
  margin-bottom: 6px;
}
.logo-glyph {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--brass);
  position: relative;
  box-shadow: 0 4px 14px -4px var(--brass-glow), inset 0 1px 0 rgba(255,255,255,.3);
}
.logo-glyph::before {
  content: ''; position: absolute; inset: 6px;
  background: var(--ink-3); border-radius: 3px;
}
.logo-glyph::after {
  content: ''; position: absolute; width: 6px; height: 6px;
  background: var(--brass); border-radius: 50%;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  box-shadow: 0 0 6px var(--brass-soft);
}
.logo-name {
  font-family: var(--display);
  font-size: 22px; font-weight: 600;
  letter-spacing: -.025em;
  color: var(--paper);
}
.logo-sub {
  font-family: var(--mono);
  font-size: 11px; color: var(--brass);
  margin-bottom: 32px;
  letter-spacing: .18em;
  text-transform: uppercase;
}

h1 {
  font-family: var(--display);
  font-size: 32px; font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1.04;
  color: var(--paper);
  margin-bottom: 12px;
}
h1 .accent { color: var(--brass); }
.subtitle {
  font-family: var(--sans);
  font-size: 13.5px; color: var(--muted);
  line-height: 1.6;
  margin-bottom: 28px;
}

.widget-wrap {
  position: relative;
  display: flex; justify-content: center;
  min-height: 44px;
  margin-bottom: 16px;
  padding: 22px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.widget-wrap::before {
  content: '// telegram_auth';
  position: absolute;
  top: -10px; left: 16px;
  padding: 2px 10px;
  background: var(--void);
  font-family: var(--mono);
  font-size: 10px; color: var(--brass);
  letter-spacing: .12em;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.widget-wrap::after {
  content: 'SECURE';
  position: absolute;
  top: -10px; right: 16px;
  padding: 2px 10px;
  background: var(--void);
  font-family: var(--mono);
  font-size: 9px; color: var(--ok);
  letter-spacing: .18em;
  border: 1px solid rgba(74,222,128,.3);
  border-radius: 4px;
}

.error {
  font-family: var(--mono);
  font-size: 11.5px; color: var(--err);
  background: var(--err-soft);
  border: 1px solid rgba(255,107,107,.3);
  border-radius: 8px;
  padding: 10px 14px;
  text-align: left;
  margin-bottom: 14px;
  font-weight: 500;
  letter-spacing: -.005em;
}

.foot {
  margin-top: 28px;
  font-family: var(--mono);
  font-size: 10.5px; color: var(--muted-2);
  line-height: 1.6;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.foot a {
  color: var(--paper); text-decoration: none;
  font-weight: 500;
  transition: color .2s;
}
.foot a:hover { color: var(--brass); }
.foot .sep { color: var(--muted-3); margin: 0 6px; }

@media (max-width: 540px) {
  .top-bar, .bottom-bar { padding: 14px 18px; font-size: 9.5px; }
  .card { padding: 32px 22px 26px; border-radius: 14px; }
  h1 { font-size: 26px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <span class="brand-mini">
    <span class="g"></span>
    <span>Gramly · AutoSending</span>
  </span>
  <span class="status">
    <span class="dot"></span>
    <span>all systems operational</span>
  </span>
</div>

<div class="card" id="card">
  <div class="logo">
    <span class="logo-glyph"></span>
    <span class="logo-name">Gramly</span>
  </div>
  <div class="logo-sub">AutoSending_</div>

  <h1>Войти<br>в <span class="accent">систему.</span></h1>
  <p class="subtitle">Используй свой Telegram-аккаунт</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <div class="widget-wrap">
    {% if bot_username %}
    <script
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="{{ bot_username }}"
      data-size="large"
      data-auth-url="{{ callback_url }}"
      data-request-access="write"
      async>
    </script>
    {% else %}
    <div style="color:var(--err);font-family:var(--mono);font-size:12px;letter-spacing:.05em">config_error</div>
    {% endif %}
  </div>

  <p class="foot">
    part_of <a href="/">Gramly</a>
    <span class="sep">·</span>
    <a href="/crm/login/">CRM</a>
    <span class="sep">·</span>
    <a href="/docs/">docs</a>
  </p>
</div>

<div class="bottom-bar">
  <span class="l">
    <span class="ln"></span>
    <span>protocol_ hmac-sha256</span>
  </span>
  <span>v 2.0 · 2025</span>
</div>

<script>
const card = document.getElementById('card');
card.addEventListener('pointermove', (e) => {
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', ((e.clientX - r.left)/r.width*100) + '%');
  card.style.setProperty('--my', ((e.clientY - r.top) /r.height*100) + '%');
});
</script>
</body>
</html>
