<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a12"><meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Ошибка{% endblock %} — Gramly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>*,*::before,*::after{box-sizing:border-box}*{margin:0}body{min-height:100svh;display:grid;place-items:center;padding:24px;overflow:hidden;background:radial-gradient(circle at 16% 10%,rgba(91,140,255,.17),transparent 32rem),radial-gradient(circle at 88% 86%,rgba(133,108,255,.14),transparent 30rem),#080a12;color:#f7f8ff;font-family:Onest,system-ui,sans-serif}body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) .7px,transparent .7px);background-size:24px 24px;opacity:.25;mask-image:linear-gradient(#000,transparent 88%)}.card{position:relative;width:min(100%,680px);padding:55px 46px;border:1px solid rgba(255,255,255,.1);border-radius:32px;text-align:center;background:linear-gradient(145deg,rgba(25,30,51,.9),rgba(10,13,24,.92));box-shadow:inset 0 1px rgba(255,255,255,.07),0 42px 100px rgba(0,0,0,.42)}.brand{display:flex;justify-content:center;align-items:center;gap:9px;font:800 15px Manrope,system-ui}.mark{width:29px;height:29px;border-radius:9px;background:linear-gradient(145deg,#65b9ff,#9277ff);box-shadow:0 9px 24px rgba(91,140,255,.3)}.code{margin:32px 0 10px;font:800 clamp(70px,18vw,130px)/.8 Manrope,system-ui;letter-spacing:-.09em;color:transparent;background:linear-gradient(105deg,#fff,#91aeff 48%,#a991ff);background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 15px 28px rgba(91,140,255,.16))}h1{font:800 clamp(28px,5vw,42px)/1.08 Manrope,system-ui;letter-spacing:-.045em}.lead{max-width:490px;margin:15px auto 0;color:#9aa1b6;font-size:15px;line-height:1.7}.actions{display:flex;justify-content:center;gap:10px;margin-top:29px;flex-wrap:wrap}.button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:14px;text-decoration:none;font:700 13px Manrope,system-ui;border:1px solid rgba(255,255,255,.1);cursor:pointer}.primary{color:#08101c;background:linear-gradient(135deg,#82c9ff,#8f7cff);box-shadow:0 14px 35px rgba(91,140,255,.24)}.secondary{color:#f7f8ff;background:rgba(255,255,255,.045)}.meta{margin-top:22px;color:#626a80;font-size:10px;letter-spacing:.08em;text-transform:uppercase}@media(max-width:560px){body{padding:14px}.card{padding:42px 20px;border-radius:24px}.actions{flex-direction:column}.button{width:100%}}@media(prefers-reduced-motion:no-preference){.card{animation:enter .55s cubic-bezier(.2,.75,.25,1) both}.code{animation:float 5s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}}@keyframes float{50%{transform:translateY(-5px)}}}</style>
</head>
<body><main class="card"><div class="brand"><span class="mark"></span>gramly.</div><div class="code">{% block code %}000{% endblock %}</div><h1>{% block heading %}Что-то пошло не так{% endblock %}</h1><p class="lead">{% block message %}Попробуйте обновить страницу чуть позже.{% endblock %}</p><div class="actions"><a class="button primary" href="/">На главную</a><button class="button secondary" type="button" onclick="location.reload()">Обновить</button></div><div class="meta">{% block meta %}Gramly system status{% endblock %}</div></main></body>
</html>
