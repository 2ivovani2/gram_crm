{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0c"><title>{% block title %}Ошибка{% endblock %} · Gramly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'dist/assets/crm.css' %}"></head><body class="system-page"><main class="system-shell"><a class="g-brand system-brand" href="/"><span class="g-brand__mark"></span><span>gramly<span class="g-brand__signal">.</span></span></a><div class="system-copy"><div class="system-visual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 3.5 18a2 2 0 0 0 1.75 3h13.5a2 2 0 0 0 1.75-3L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg></div><div class="system-code">{% block meta %}System state{% endblock %}</div><h1>{% block heading %}Что-то пошло не так{% endblock %}</h1><p>{% block message %}Обновите страницу или вернитесь на главную.{% endblock %}</p><div class="system-actions"><button class="g-button g-button--primary" onclick="location.reload()">Попробовать снова</button><a class="g-button g-button--secondary" href="/">На главную</a></div></div></main></body></html>
