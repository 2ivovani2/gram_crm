<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Нет доступа — Gramly CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4EFE5; --bg-2: #EDE6D6;
  --surface: #FBFAF5; --surface-2: #FFFFFF;
  --ink: #1A1714; --ink-2: #3B342C;
  --muted: #7A6F60; --muted2: #9D9182;
  --line: #E5DBC8; --line-2: #EEE6D4;
  --accent: #8A5A1F; --accent-tint: #FBF3DE;
  --accent-soft: #F4E6C6; --accent-ink: #4E3010;
}
body {
  font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  letter-spacing: -.005em;
}
body::before {
  content:''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 800px 600px at 0% 0%, rgba(138,90,31,.07) 0%, transparent 60%),
    radial-gradient(ellipse 600px 500px at 100% 100%, rgba(138,90,31,.05) 0%, transparent 60%);
}
body::after {
  content:''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(26,23,20,.025) .9px, transparent .9px);
  background-size: 22px 22px; opacity: .5;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(.99); }
  to   { opacity: 1; transform: none; }
}
.card {
  position: relative; z-index: 1;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 52px 44px;
  text-align: center;
  max-width: 440px; width: calc(100% - 32px);
  box-shadow: 0 1px 0 rgba(26,23,20,.02), 0 32px 80px -16px rgba(26,23,20,.18);
  animation: cardIn .55s cubic-bezier(.2,.8,.3,1) both;
}
.icon-wrap {
  width: 72px; height: 72px; border-radius: 20px;
  background: var(--bg); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px; color: var(--accent);
  box-shadow: 0 4px 12px rgba(26,23,20,.04);
}
h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 38px; font-weight: 400;
  letter-spacing: -.02em;
  line-height: 1.05;
  margin-bottom: 14px; color: var(--ink);
}
p {
  font-size: 14.5px; color: var(--muted);
  line-height: 1.7; margin-bottom: 32px;
  font-weight: 500;
}
p strong { color: var(--ink); font-weight: 600; }

.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 22px; border-radius: 12px;
  font-size: 13.5px; font-weight: 600;
  cursor: pointer; text-decoration: none;
  transition: all .18s;
  border: 1px solid transparent;
  letter-spacing: -.005em;
}
.btn-ghost {
  background: var(--surface);
  color: var(--ink-2);
  border-color: var(--line);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  background: var(--ink);
  color: #FBFAF5;
  box-shadow: 0 2px 4px rgba(26,23,20,.06), 0 8px 16px -4px rgba(26,23,20,.12);
}
.btn-primary:hover {
  background: #2A241E;
  transform: translateY(-1px);
}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0110 0v4"/>
    </svg>
  </div>
  <h1>Нет доступа к CRM</h1>
  <p>
    Вы авторизованы как <strong>{{ user.display_name }}</strong>, но у вас нет доступа ни к одному рабочему пространству. Обратитесь к главному администратору для получения доступа.
  </p>
  <div class="btns">
    <form action="{% url 'crm:logout' %}" method="post" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-ghost">Выйти</button>
    </form>
    <a href="{% url 'landing' %}" class="btn btn-primary">На главную →</a>
  </div>
</div>
</body>
</html>
