name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  SECRET_KEY: ci-only-secret-key
  DATABASE_URL: sqlite:////tmp/gramly-ci.sqlite3
  DJANGO_SETTINGS_MODULE: config.settings.dev
  TEST_BOT_TOKEN: 123456:test-token
  AWS_ACCESS_KEY_ID: ci
  AWS_SECRET_ACCESS_KEY: ci
  AWS_STORAGE_BUCKET_NAME: ci
  AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/crm/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "services/crm[dev]"
      - name: Lint
        run: make lint-crm
      - name: Typecheck baseline
        run: make typecheck-crm
      - name: Django checks and migration gate
        run: make check
      - name: Unit and integration tests
        run: make test-crm
      - name: Static files
        run: cd services/crm && python manage.py collectstatic --noinput --clear

  welcome:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gramly_welcome_test
          POSTGRES_USER: gramly_welcome
          POSTGRES_PASSWORD: gramly_welcome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gramly_welcome -d gramly_welcome_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WELCOME_DATABASE_URL: postgresql+asyncpg://gramly_welcome:gramly_welcome@postgres:5432/gramly_welcome_test
      WELCOME_TEST_DATABASE_URL: postgresql+asyncpg://gramly_welcome:gramly_welcome@postgres:5432/gramly_welcome_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/welcome/pyproject.toml
      - run: python -m pip install -e "services/welcome[dev]"
      - name: Verify PostgreSQL service DNS
        run: |
          python - <<'PY'
          import socket
          try:
              socket.getaddrinfo("postgres", 5432)
              with socket.create_connection(("postgres", 5432), timeout=10):
                  pass
          except OSError as exc:
              raise SystemExit("PostgreSQL service is unreachable. Forgejo runner must use container.network: empty (per-job network), not Docker default bridge.") from exc
          PY
      - run: cd services/welcome && alembic upgrade head
      - run: python -m ruff check services/welcome ops/welcome
      - run: cd services/welcome && python -m mypy src tests
      - run: python -m pytest services/welcome/tests ops/welcome/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p frontend/welcome/tsconfig.json
      - name: Install Chromium for Welcome editor regression tests
        run: npx playwright install --with-deps chromium
      - name: Welcome catalog and editor browser tests
        run: |
          npm run dev:welcome -- --host 127.0.0.1 --port 5187 > /tmp/welcome-vite.log 2>&1 &
          WELCOME_VITE_PID=$!
          trap 'kill "$WELCOME_VITE_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5187/app.html > /dev/null; then break; fi
            sleep 1
          done
          WELCOME_CATALOG_TEST_URL=http://127.0.0.1:5187 npx playwright test frontend/tests/welcome-catalog.spec.js frontend/tests/welcome-editor.spec.js frontend/tests/welcome-admin-catalog.spec.js --project=chromium --workers=2
      - run: npm audit --audit-level=high

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s ops/ci/tests -v
      - name: Install pinned kubectl
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 90 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output kubectl \
            https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl
          echo "ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336  kubectl" | sha256sum --check
          install --mode 0755 kubectl /usr/local/bin/kubectl
      - run: make manifests

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/terraform fmt -check -diff
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/crm/pyproject.toml
      - run: python -m pip install -e "services/crm[dev]"
      - name: High severity Python findings
        run: python -m bandit -q -r services/crm services/welcome ops/welcome -x 'services/crm/**/tests,services/crm/**/migrations,services/welcome/tests,services/welcome/alembic' -lll

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without publishing
        run: |
          docker build --file services/crm/Dockerfile --tag gramly-crm:ci .
          docker build --file services/welcome/Dockerfile --tag gramly-welcome:ci .
          docker build --file services/welcome-web/Dockerfile --tag gramly-welcome-web:ci .
          docker run --rm --add-host gramly-welcome-api:127.0.0.1 \
            gramly-welcome-web:ci nginx -t
