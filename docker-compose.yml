# ─────────────────────────────────────────────────────────────────────────────
# Gramly — unified production compose stack
#
# Domains:
#   gramly.tech       → landing + docs (spambotcontrol Django)
#   crm.gramly.tech   → CRM  (spambotcontrol Django, /crm/ prefix)
#   spam.gramly.tech  → spam app (autosending: Next.js + FastAPI)
#
# One compose, one PostgreSQL container (two databases: gramly + autosending),
# one nginx with three server blocks, one certbot for all three domains.
# ─────────────────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ── Shared infrastructure ──────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-gramly}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./spambotcontrol/data/postgres:/var/lib/postgresql/data
      - ./scripts/pg_init.sh:/docker-entrypoint-initdb.d/pg_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gramly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_BROWSER:       "off"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@minio:9000
    entrypoint: >
      /bin/sh -c "
        mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME} &&
        mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME} &&
        echo 'MinIO bucket ready'
      "

  # ── spambotcontrol (gramly.tech / crm.gramly.tech) ──────────────────────────

  web:
    <<: *common
    build:
      context: ./spambotcontrol
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - static_files:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 3 http://localhost:8000/health/ -o /dev/null || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  celery_worker:
    <<: *common
    build:
      context: ./spambotcontrol
    command: celery -A config.celery worker -l info -c 4 -Q celery,default,broadcasts
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  celery_beat:
    <<: *common
    build:
      context: ./spambotcontrol
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  # ── autosending (spam.gramly.tech) ────────────────────────────────────────

  spam-backend:
    build:
      context: ./autosending
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/autosending"
      JWT_SECRET_KEY: ${SPAM_JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${PROD_BOT_TOKEN}
    volumes:
      - spam_sessions:/app/data/sessions
      - spam_logs:/app/data/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - default

  spam-frontend:
    build:
      context: ./autosending
      dockerfile: docker/frontend.Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL:     "https://spam.gramly.tech"
        NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_GRAMLY_URL:  "https://gramly.tech"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      spam-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode >= 500 ? 1 : 0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - default

  # ── Nginx (handles all three subdomains) ──────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gramly.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
      spam-frontend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  redis_data:
  static_files:
  letsencrypt:
  certbot_www:
  minio_data:
  spam_sessions:
  spam_logs:
