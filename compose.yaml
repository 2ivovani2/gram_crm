name: gramly

x-crm: &crm
  build:
    context: .
    dockerfile: services/crm/Dockerfile
  env_file:
    - path: .env.example
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

x-welcome: &welcome
  build:
    context: .
    dockerfile: services/welcome/Dockerfile
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    WELCOME_DATABASE_URL: postgresql+asyncpg://gramly_welcome:gramly_welcome@welcome-postgres:5432/gramly_welcome
    WELCOME_INTERFACE_WEBHOOK_SECRET: ${WELCOME_INTERFACE_WEBHOOK_SECRET:-local-interface-secret}
    WELCOME_VALKEY_URL: redis://redis:6379/1
    WELCOME_S3_ENDPOINT_URL: http://minio:9000
    WELCOME_S3_BUCKET_NAME: ${WELCOME_S3_BUCKET_NAME:-gramly-media}
    WELCOME_S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    WELCOME_S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  depends_on:
    welcome-postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gramly}
      POSTGRES_USER: ${POSTGRES_USER:-gramly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gramly}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    volumes: [valkey_data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  welcome-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gramly_welcome
      POSTGRES_USER: gramly_welcome
      POSTGRES_PASSWORD: gramly_welcome
    ports: ["5433:5432"]
    volumes: [welcome_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gramly_welcome -d gramly_welcome"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID:-minioadmin}:${AWS_SECRET_ACCESS_KEY:-minioadmin}@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-gramly-media} &&
        mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-gramly-media}

  crm-web:
    <<: *crm
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "true"
    ports: ["8000:8000"]
    volumes: [./services/crm:/app]

  crm-worker:
    <<: *crm
    command: celery -A config.celery worker -l info -c 2 -Q celery,default,broadcasts
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes: [./services/crm:/app]

  crm-beat:
    <<: *crm
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes: [./services/crm:/app]

  welcome-migrate:
    <<: *welcome
    command: alembic upgrade head
    restart: "no"

  welcome-api:
    <<: *welcome
    depends_on:
      welcome-postgres:
        condition: service_healthy
      welcome-migrate:
        condition: service_completed_successfully
    ports: ["8080:8080"]
    volumes: [./services/welcome:/app]
    networks:
      default:
        aliases: [gramly-welcome-api]

  welcome-web:
    build:
      context: .
      dockerfile: services/welcome-web/Dockerfile
    depends_on:
      welcome-api:
        condition: service_started
    ports: ["8081:8080"]

  welcome-worker-events:
    <<: *welcome
    command: welcome-worker-events
    depends_on:
      welcome-postgres:
        condition: service_healthy
      welcome-migrate:
        condition: service_completed_successfully
    volumes: [./services/welcome:/app]

  welcome-worker-delivery:
    <<: *welcome
    command: welcome-worker-delivery
    profiles: [welcome-cutover]
    depends_on:
      welcome-postgres:
        condition: service_healthy
      welcome-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes: [./services/welcome:/app]

  welcome-worker-billing:
    <<: *welcome
    command: welcome-worker-billing
    profiles: [welcome-cutover]
    depends_on:
      welcome-postgres:
        condition: service_healthy
      welcome-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes: [./services/welcome:/app]

  welcome-worker-notifications:
    <<: *welcome
    command: welcome-worker-notifications
    profiles: [welcome-cutover]
    depends_on:
      welcome-postgres:
        condition: service_healthy
      welcome-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes: [./services/welcome:/app]

  ngrok:
    image: ngrok/ngrok:latest
    profiles: [tunnel]
    command: http crm-web:8000 --domain=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports: ["4040:4040"]
    depends_on: [crm-web]

volumes:
  postgres_data:
  welcome_postgres_data:
  valkey_data:
  minio_data:
