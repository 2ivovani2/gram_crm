# ─────────────────────────────────────────────────────────────────────────────
# Dev overrides for the unified Gramly stack.
# Applied on top of docker-compose.yml.
#
# Architecture on dev:
#   User → ngrok (HTTPS) → nginx:80 → path routing → backends
#
# Path routing (mirrors prod subdomain layout):
#   /         → Django  (landing, /crm/, /docs/, /health/, /bot/webhook/)
#   /api/     → autosending FastAPI
#   /spam/    → autosending Next.js (basePath=/spam)
#   /static/  → Django staticfiles
#   /s3/      → MinIO
#
# Dev vs prod differences:
#   • nginx uses nginx/dev.conf (HTTP-only, path routing) instead of gramly.conf
#   • ngrok tunnels to nginx:80 (not directly to web:8000)
#   • All app services use hot-reload + source bind-mounts
#   • Next.js gets NEXT_PUBLIC_BASE_PATH=/spam for path-based routing
#   • NEXT_PUBLIC_API_URL points to https://<ngrok>/api (resolved at runtime)
#   • postgres, redis, minio ports exposed for local dev tools
#   • certbot disabled (TLS handled by ngrok)
#
# Usage: make dev  (runs scripts/dev_up.sh)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Shared infra: expose ports for local debugging ─────────────────────────

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  # ── MinIO dev: expose S3 API + enable browser console ─────────────────────
  minio:
    environment:
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"   # S3 API + browser file URLs (MEDIA_S3_PUBLIC_URL=http://localhost:9000)
      - "9001:9001"   # MinIO Console UI

  # ── nginx dev: use HTTP-only path-based config, ngrok provides TLS ─────────
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro   # replaces gramly.conf
      - static_files:/app/staticfiles:ro
      # letsencrypt/certbot_www volumes from base are mounted but unused in dev
    depends_on:
      web:
        condition: service_healthy

  # ── certbot: disable in dev (TLS handled by ngrok) ────────────────────────
  certbot:
    entrypoint: ["sh", "-c", "exit 0"]
    restart: "no"

  # ── spambotcontrol: dev overrides ─────────────────────────────────────────

  web:
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./spambotcontrol:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "true"
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    # No host ports — access only via nginx/ngrok

  celery_worker:
    command: celery -A config.celery worker -l debug -c 2 -Q celery,default,broadcasts
    volumes:
      - ./spambotcontrol:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  celery_beat:
    command: celery -A config.celery beat -l debug --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./spambotcontrol:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  # ── autosending: dev overrides ─────────────────────────────────────────────

  spam-backend:
    build:
      context: ./autosending
      dockerfile: docker/backend.Dockerfile
      target: dev          # uvicorn --reload, source bind-mounted
    volumes:
      - ./autosending/backend:/app
    # No host ports — accessed via nginx/ngrok at /api/
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # DATABASE_URL, JWT_SECRET_KEY, TELEGRAM_BOT_TOKEN come from root .env via x-common or here:
      TELEGRAM_BOT_TOKEN: ${TEST_BOT_TOKEN}

  spam-frontend:
    build:
      context: ./autosending
      dockerfile: docker/frontend.Dockerfile
      target: dev          # next dev with hot-reload
    volumes:
      - ./autosending/frontend:/app   # source bind-mount
      - /app/node_modules             # preserve image's node_modules (not host's)
      - /app/.next                    # isolate .next cache inside container
    # No host ports — accessed via nginx/ngrok at /spam/
    # healthcheck overrides base: basePath=/spam so / returns 404 in dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/spam/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    environment:
      # basePath=/spam so Next.js routes, links, and asset URLs all live under /spam/
      NEXT_PUBLIC_BASE_PATH: /spam
      NEXT_PUBLIC_API_URL: https://${NGROK_DOMAIN}
      NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
