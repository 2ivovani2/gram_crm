[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gramly-welcome"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
welcome-api = "gramly_welcome.main:run"
welcome-worker-events = "gramly_welcome.workers.events:run"
welcome-worker-delivery = "gramly_welcome.workers.delivery:run"
welcome-worker-billing = "gramly_welcome.workers.billing:run"
welcome-maintenance = "gramly_welcome.maintenance:run"
welcome-reconcile-interface-webhook = "gramly_welcome.webhook_admin:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
