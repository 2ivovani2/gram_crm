server {
    listen 8080 default_server;
    server_name hello.gramly.tech localhost _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' https://fonts.googleapis.com; script-src 'self' https://telegram.org; font-src 'self' https://fonts.gstatic.com; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'self'" always;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/v1/ {
        proxy_pass http://gramly-welcome-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/admin/ { return 404; }
    location = /app { return 308 /app/; }
    location = /app.html { internal; }
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /app/ { try_files $uri $uri/ /app.html; add_header Cache-Control "no-store"; }
    location /admin/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { return 404; }
}

server {
    listen 8080;
    server_name hello-admin.gramly.tech welcome-admin.localhost;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/admin/v1/ {
        proxy_pass http://gramly-welcome-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # oauth2-proxy overwrites these trusted identity headers after the
        # Authentik session and allowed-groups check succeeds.
        proxy_set_header X-authentik-username $http_x_forwarded_preferred_username;
        proxy_set_header X-authentik-groups $http_x_forwarded_groups;
        proxy_read_timeout 30s;
    }
    location /api/v1/ { return 404; }
    location = / { return 308 /admin/; }
    location = /admin { return 308 /admin/; }
    location = /admin.html { internal; }
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /admin/ { try_files $uri $uri/ /admin.html; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { return 404; }
}
