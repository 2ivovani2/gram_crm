[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gramly-crm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.14",
    "django-unfold==0.37.0",
    "whitenoise[brotli]==6.7.0",
    "aiogram==3.7.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.7",
    "celery==5.3.6",
    "django-environ==0.11.2",
    "gunicorn==21.2.0",
    "uvicorn[standard]==0.29.0",
    "aiohttp==3.9.5",
    "aiofiles==23.2.1",
    "django-celery-results==2.5.1",
    "django-celery-beat==2.6.0",
    "asgiref==3.8.1",
    "openpyxl>=3.1.0",
    "django-storages[boto3]>=1.14",
    "cryptography>=42.0,<46.0",
    "mozilla-django-oidc==5.0.2",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2.0",
    "django-debug-toolbar==4.3.0",
    "ipython==8.25.0",
    "mypy>=1.16,<2.0",
    "pytest==8.2.0",
    "pytest-django==4.8.0",
    "pytest-asyncio==0.23.6",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["**/migrations/**"]

[tool.ruff.lint]
# Start with correctness errors on the legacy Django code. Style rules can be
# tightened per service without turning the initial migration into a rewrite.
select = ["E4", "E7", "E9", "F"]
# Legacy service methods deliberately import Django models inside functions to
# avoid app-loading cycles while their public annotations use forward names.
# F821 is enforced without this exception in the new standalone services.
ignore = ["F403", "F405", "F821"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["config.settings.*"]
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
