<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSO-аккаунт не привязан — Gramly CRM</title>
  {% include "ui/favicon.html" %}
  <style>
    :root { color-scheme: dark; --bg:#070908; --panel:#141815; --text:#f2f0e7; --muted:#aaa99f; --acid:#ddf45b; --line:#30352f; --error:#ff7868; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.6 Onest,system-ui,sans-serif; }
    main { width:min(100%,620px); border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:clamp(28px,6vw,56px); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
    .brand::before { content:"G/"; display:grid; place-items:center; width:34px; height:34px; background:var(--acid); color:var(--bg); border-radius:4px; }
    .code { margin:48px 0 12px; color:var(--error); font:600 12px/1 ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0 0 18px; font-size:clamp(34px,7vw,58px); line-height:1; letter-spacing:-.04em; }
    p { margin:0; color:var(--muted); }
    .actions { display:flex; gap:12px; align-items:center; margin-top:36px; flex-wrap:wrap; }
    a { display:inline-flex; min-height:46px; align-items:center; justify-content:center; padding:0 20px; border:1px solid var(--acid); border-radius:4px; background:var(--acid); color:var(--bg); font-weight:700; text-decoration:none; }
    a.secondary { background:transparent; color:var(--text); border-color:var(--line); }
  </style>
</head>
<body>
  <main>
    <div class="brand">Gramly CRM</div>
    <div class="code">Identity link required</div>
    <h1>SSO-аккаунт не привязан к CRM.</h1>
    <p>{{ error_message }}</p>
    <div class="actions">
      <a href="{{ retry_url }}">Повторить вход</a>
      <a class="secondary" href="https://auth.gramly.tech/">Открыть Authentik</a>
    </div>
  </main>
</body>
</html>
