<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Нет доступа — Gramly CRM</title>
{% include "ui/favicon.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --void: #07080A;
  --ink-2: #111317;
  --ink-3: #1A1D24;
  --paper: #FAFAFB;
  --muted:   rgba(250,250,251,.55);
  --muted-2: rgba(250,250,251,.35);
  --muted-3: rgba(250,250,251,.22);
  --line:    rgba(250,250,251,.08);
  --line-hi: rgba(250,250,251,.18);
  --brass: #FFB84D; --brass-soft:#FFD485;
  --brass-glow: rgba(255,184,77,.32);
  --err: #FF6B6B;
  --display:'Space Grotesk',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
body {
  font-family: var(--sans);
  background: var(--void); color: var(--paper);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
  position: relative; overflow: hidden;
  padding: 24px;
}
::selection { background: var(--brass); color: var(--void); }

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(250,250,251,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(250,250,251,.04) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
}
body::after {
  content: ''; position: fixed; inset: -10%; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,184,77,.16) 0%, transparent 60%);
  filter: blur(50px);
}
@keyframes cardIn { from { opacity:0; transform: translateY(22px) scale(.98); } to { opacity:1; transform: none; } }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.6);} }

.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 28px;
  font-family: var(--mono); font-size: 11px;
  color: var(--muted-2);
  letter-spacing: .12em; text-transform: uppercase;
}
.top-bar .brand-mini { display: flex; align-items: center; gap: 10px; color: var(--paper); }
.top-bar .brand-mini .g {
  width: 18px; height: 18px; border-radius: 4px;
  background: var(--brass); position: relative;
  box-shadow: 0 0 12px var(--brass-glow);
}
.top-bar .brand-mini .g::before { content:''; position:absolute; inset:3px; background:var(--ink-3); border-radius:2px; }
.top-bar .brand-mini .g::after { content:''; position:absolute; width:4px; height:4px; background:var(--brass); border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); }
.top-bar .err {
  display: flex; align-items: center; gap: 10px;
  color: var(--err);
}
.top-bar .err .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--err);
  box-shadow: 0 0 0 4px rgba(255,107,107,.18), 0 0 12px rgba(255,107,107,.5);
  animation: pulse 2.2s ease infinite;
}

.card {
  position: relative; z-index: 1; overflow: hidden;
  width: 100%; max-width: 460px;
  background: rgba(11,12,15,.7);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 48px 42px 36px;
  text-align: center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 32px 80px -20px rgba(0,0,0,.6);
  animation: cardIn .6s cubic-bezier(.2,.8,.3,1) both;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 20%, var(--err) 50%, transparent 80%);
  pointer-events: none;
}

.icon-wrap {
  width: 64px; height: 64px;
  border-radius: 16px;
  background: var(--ink-2);
  border: 1px solid var(--line-hi);
  display: grid; place-items: center;
  margin: 0 auto 28px;
  color: var(--err);
  box-shadow: 0 8px 22px -8px rgba(255,107,107,.25);
}

.stamp {
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 22px;
  padding: 5px 12px;
  background: rgba(255,107,107,.10);
  border: 1px solid rgba(255,107,107,.3);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 10px; color: var(--err);
  letter-spacing: .14em; text-transform: uppercase;
}
.stamp .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--err);
  box-shadow: 0 0 8px rgba(255,107,107,.6);
}

h1 {
  font-family: var(--display);
  font-size: 36px; font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1.02;
  margin-bottom: 16px;
  color: var(--paper);
}
h1 .accent { color: var(--err); }
p {
  font-family: var(--sans);
  font-size: 14px; color: var(--muted);
  line-height: 1.65;
  margin-bottom: 36px;
}
p strong { color: var(--paper); font-weight: 600; }

.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 22px;
  border-radius: 8px;
  font-family: var(--display);
  font-size: 13px; font-weight: 500;
  cursor: pointer; text-decoration: none;
  border: 1px solid transparent;
  letter-spacing: -.005em;
  transition: transform .2s, background .2s, border-color .2s, box-shadow .25s;
}
.btn-ghost {
  background: var(--ink-2);
  color: var(--paper);
  border-color: var(--line-hi);
}
.btn-ghost:hover { background: var(--ink-3); border-color: var(--err); color: var(--err); }
.btn-primary {
  background: var(--paper);
  color: var(--void);
  border-color: var(--paper);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 30px -8px rgba(250,250,251,.4);
}
</style>
</head>
<body>

<div class="top-bar">
  <span class="brand-mini">
    <span class="g"></span>
    <span>Gramly · CRM</span>
  </span>
  <span class="err">
    <span class="dot"></span>
    <span>access denied</span>
  </span>
</div>

<div class="card">
  <div class="stamp"><span class="dot"></span> err_ 403 · workspace_required</div>

  <div class="icon-wrap">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0110 0v4"/>
    </svg>
  </div>

  <h1>Нет <span class="accent">доступа</span><br>к CRM.</h1>
  <p>
    Вы авторизованы как <strong>{{ user.display_name }}</strong>, но не входите ни в одно рабочее пространство. Обратитесь к главному администратору для получения доступа.
  </p>
  <div class="btns">
    <form action="{% url 'crm:logout' %}" method="post" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-ghost">Выйти</button>
    </form>
    <a href="{% url 'landing' %}" class="btn btn-primary">На главную →</a>
  </div>
</div>

</body>
</html>
